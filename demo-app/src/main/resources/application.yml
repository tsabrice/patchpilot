spring:
  application:
    name: patchpilot-demo-app

  # H2 in-memory database — lets the app start without an external PostgreSQL instance.
  # To use a real PostgreSQL, override SPRING_DATASOURCE_URL, USERNAME, and PASSWORD
  # via environment variables or an application-postgres.yml profile.
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:h2:mem:demodb;DB_CLOSE_DELAY=-1}
    driver-class-name: ${SPRING_DATASOURCE_DRIVER:org.h2.Driver}
    username: ${SPRING_DATASOURCE_USERNAME:sa}
    password: ${SPRING_DATASOURCE_PASSWORD:}

  jpa:
    hibernate:
      # create-drop: schema is created on startup and dropped on shutdown.
      # Suitable for H2 in-memory; override to 'none' when using PostgreSQL
      # with Flyway managing the schema.
      ddl-auto: ${SPRING_JPA_DDL_AUTO:create-drop}
    show-sql: false

  h2:
    console:
      # H2 web console available at /h2-console when running locally
      enabled: true
      path: /h2-console

server:
  port: ${SERVER_PORT:8080}
