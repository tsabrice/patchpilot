spring:
  application:
    name: patchpilot-ai-agent

  # ── Database ────────────────────────────────────────────────────────────────
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}

  jpa:
    hibernate:
      # validate: Hibernate checks that the schema matches the entities but
      # never creates or alters tables. Flyway owns all DDL changes.
      ddl-auto: validate
    open-in-view: false   # prevents lazy-loading queries during JSON serialisation

  # ── Flyway ──────────────────────────────────────────────────────────────────
  # On startup, Flyway scans db/migration/, compares checksums against
  # flyway_schema_history, and runs any pending V*.sql files in order.
  flyway:
    enabled: true
    locations: classpath:db/migration

  # ── Auth0 JWT resource server ────────────────────────────────────────────────
  # jwk-set-uri (not issuer-uri) is intentional: Spring fetches the JWKS lazily
  # — only when it needs to validate an incoming JWT, not at startup. This lets
  # the app start and serve the webhook endpoint even when Auth0 is not yet
  # configured (Week 2 smoke test). Auth0 is fully wired in Week 3.
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: https://${AUTH0_DOMAIN:-placeholder.auth0.com}/.well-known/jwks.json

# ── Server ──────────────────────────────────────────────────────────────────
server:
  port: ${AI_AGENT_PORT:8081}

# ── Actuator ────────────────────────────────────────────────────────────────
# /actuator/health — used by Docker Compose healthcheck
# /actuator/prometheus — scraped by Prometheus every 15s
management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      show-details: always

# ── Resilience4j ─────────────────────────────────────────────────────────────
# Circuit breakers on all external API calls (Claude + GitHub).
# After 5 failures in a 10-call sliding window, the circuit opens for 30s.
# Circuit state is exposed as a Micrometer metric and visible in Grafana.
resilience4j:
  circuitbreaker:
    instances:
      claude-api:
        slidingWindowSize: 10
        failureRateThreshold: 50
        waitDurationInOpenState: 30s
        permittedNumberOfCallsInHalfOpenState: 2
      github-api:
        slidingWindowSize: 10
        failureRateThreshold: 50
        waitDurationInOpenState: 30s
        permittedNumberOfCallsInHalfOpenState: 2
  timelimiter:
    instances:
      claude-api:
        timeoutDuration: 30s
      github-api:
        timeoutDuration: 15s

# ── Application properties ────────────────────────────────────────────────────
claude:
  mode: ${CLAUDE_MODE:max}
  api-key: ${CLAUDE_API_KEY:}
  # Model used when claude.mode=api.
  # Override via CLAUDE_MODEL env var — e.g. set to claude-sonnet-4-6 for demo recording.
  model: ${CLAUDE_MODEL:claude-haiku-4-5-20251001}

github:
  token: ${GITHUB_TOKEN:}
  owner: ${GITHUB_OWNER:}
  repo: ${GITHUB_REPO:demo-app}

sonarqube:
  url: ${SONARQUBE_URL:http://sonarqube:9000}
  token: ${SONARQUBE_TOKEN:}
  webhook-secret: ${SONARQUBE_WEBHOOK_SECRET:}

# ── Logging ──────────────────────────────────────────────────────────────────
logging:
  level:
    ca.uqam.patchpilot: INFO
